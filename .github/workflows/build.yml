name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: gradle wrapper --gradle-version 8.4
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SystemTool-APK
          path: app/build/outputs/apk/release/*.apk
      - name: Create gradle files
        run: |
          cat > settings.gradle << 'EOF1'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SystemTool"
          include ':app'
          EOF1
          cat > build.gradle << 'EOF2'
          plugins {
              id 'com.android.application' version '8.1.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.10' apply false
          }
          EOF2
          cat > gradle.properties << 'EOF3'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF3
          cat > app/build.gradle << 'EOF4'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.dj.systool'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dj.systool"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildTypes {
                  release { signingConfig signingConfigs.debug }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF4
          mkdir -p app/src/main/java/com/dj/systool
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
